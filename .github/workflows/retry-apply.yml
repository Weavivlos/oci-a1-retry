name: retry-apply

on:
  workflow_dispatch:

concurrency:
  group: retry-apply
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install OCI CLI
        run: pip install -r requirements.txt

      - name: Configure OCI CLI
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<CFG
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/key.pem
          CFG
          sed -i 's/^ *//' ~/.oci/config

      - name: Apply stack
        id: apply
        env:
          OCI_STACK_ID: ${{ secrets.OCI_STACK_ID }}
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
        run: bash scripts/apply.sh

      - name: Stop scheduling after success
        if: steps.apply.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable retry-apply --repo "$GITHUB_REPOSITORY"
